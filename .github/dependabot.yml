# One grouped pull request a month per ecosystem, so updates stay reviewable.
# Security fixes are raised separately as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades change behaviour or need code changes, so they are done
      # by hand, one at a time, with the full test suite.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Present only to keep the npm tree valid (see README, Troubleshooting).
      # Their versions follow what @hookform/resolvers asks for.
      - dependency-name: ajv
      - dependency-name: ajv-formats
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
